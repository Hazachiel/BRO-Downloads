<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>BRO-Downloads</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="header">
    <div class="logo">
      <img src="icons/icon-48.png" alt="Logo" width="28" height="28">
      <span>BRO-Downloads</span>
    </div>
    <div id="status-badge" class="badge checking">Verificando...</div>
  </div>

  <div class="content">
    <div class="toggle-row">
      <label for="toggle-intercept" class="toggle-label">
        <b>Captura de descargas</b>
        <span class="subtext">Interceptar descargas iniciadas en el navegador</span>
      </label>
      <input type="checkbox" id="toggle-intercept" checked>
    </div>

    <hr class="separator">

    <div class="info-card">
      <div class="info-title">🔌 Estado del Puente Nativo:</div>
      <div id="native-status" class="info-detail">Comprobando Native Messaging...</div>
    </div>

    <div class="btn-row">
      <button id="btn-test-native" class="btn primary">⚡ Probar Puente Nativo</button>
    </div>

    <hr class="separator">

    <details>
      <summary style="cursor:pointer; color:#70a5ff; font-size:12px; margin-bottom:8px;">
        ⚙️ Configuración Fallback HTTP (Opcional)
      </summary>
      <div class="field-group">
        <label for="port-input">Puerto HTTP:</label>
        <input type="number" id="port-input" value="9876">
      </div>
      <div class="field-group">
        <label for="token-input">Token de seguridad:</label>
        <input type="password" id="token-input" placeholder="Token de la app">
      </div>
      <div class="btn-row">
        <button id="btn-save" class="btn secondary">Guardar Fallback</button>
      </div>
    </details>

    <hr class="separator">

    <div class="btn-row">
      <button id="btn-send-tab" class="btn secondary">⬇️ Descargar enlace de pestaña actual</button>
    </div>
  </div>

  <div class="footer">
    <span id="version-text">BRO-Downloads v1.1</span>
  </div>

  <script src="popup.js"></script>
</body>

</html>
